<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
    <link href="./img/icon1.jpg" rel="icon">
</head>
<body>
    <div class="wrapper">
        <form action="">
            <h2>Register</h2>
<br>
            <pre style="color: white;"> Create your account . It's free and only takes a minute.</pre>

            <div class="input-group">
                <span class="icon">
                    <ion-icon name="person"></ion-icon>
                </span>
                <input type="text" placeholder="First Name" required>
    
            </div>

            <div class="input-group">
                <span class="icon">
                    <ion-icon name="person"></ion-icon>
                </span>
                <input type="text" placeholder="Last Name" required>
    
            </div>

            <div class="input-group">
                <span class="icon">
                    <ion-icon name="lock-closed"></ion-icon>
                </span>
                <input type="password" placeholder="New Password" required>
            </div>

            <div class="input-group">
                <span class="icon">
                    <ion-icon name="lock-closed"></ion-icon>
                </span>
                <input type="password" placeholder="Confirm Password" required>
            </div>

            <div class="che">
                <input type="checkbox" required> I accept the <span style="color: yellow;">Terms & Contidtions.</span></input>
            </div>
             

            <button type="submit" class="btn">Register</button>
        </form>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
